gremlin.graph=org.apache.hugegraph.HugeFactory

backend=rocksdb
serializer=binary

store=hugegraph

rocksdb.data_path=./storage/hugegraph-rocksdb
rocksdb.wal_path=./storage/hugegraph-rocksdb

# task config
task.scheduler_type=local
task.schedule_period=10
task.retry=0
task.wait_timeout=300

# search config
search.text_analyzer=jieba
search.text_analyzer_mode=INDEX
